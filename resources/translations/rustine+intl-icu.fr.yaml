title: "Sécurité : corriger les dépendances {ecosystem} ({group})"
title_all: "Sécurité : corriger les dépendances {ecosystem}"

group:
  critical-high: "sévérité critique et haute"
  others: "sévérité moyenne, basse et inconnue"

preview: "Aperçu du plan : rien n’a encore été exécuté, les corrections ci-dessous sont prévues mais non vérifiées."

summary:
  fixed: "Paquets corrigés : {packages} · CVE corrigées : {cves}"
  planned: "Paquets à corriger : {packages} · CVE à corriger : {cves}"

section:
  fixed: "🔧 Corrections"
  lock: "📦 Changements du lockfile"
  attention: "⚠️ Action manuelle requise"
  debt: "🧹 Dette technique"
  verification: "🔍 Vérification"
  tooling: "🛠️ Outillage"

table:
  package: "Paquet"
  version: "Version"
  cves: "CVE"
  severity: "Sévérité"
  dependency: "Dépendance"
  strategy: "Stratégie"

dependency:
  direct: "directe"
  transitive: "transitive, via {chain}"
  unknown: "inconnue"

strategy:
  lockfile-refresh: "rafraîchissement du lockfile"
  direct-bump: "relèvement de la plage"
  resolution: "resolution"
  already: "corrigé par une autre modification de cette MR"
  planned: "prévue"

attention:
  major_bump: "{cves} corrigées uniquement dans une nouvelle version majeure ({versions}) : non appliqué automatiquement."
  no_fix: "{cves} : aucune version corrigée n’a été publiée."
  unparsable: "la version installée {version} n’est pas comparable : à vérifier à la main."
  unsupported_source: "déclaré avec une source que Rustine ne modifie pas : à mettre à jour à la main vers une version qui corrige {cves}."
  failed: "aucune correction automatique n’a fonctionné pour {cves}."
  still_reported: "Trivy signale encore {cves} après la correction : vérifiez le résultat à la main."
  yarn_lockfile: "également une dépendance Yarn ({sources}) : ses fichiers ont changé, lancez `yarn install` et commitez `yarn.lock`, sinon l’installation Yarn avec lockfile figé échoue."
  technical_details: "Détails techniques"

lock:
  summary: "{file} change pour {changed} paquets (corrigés ci-dessus : {fixed}). Les autres ont suivi, dans les limites des plages déclarées par leurs parents."
  show: "Afficher les paquets modifiés"
  before: "Avant"
  after: "Après"
  more: "… et {count} autres"

debt:
  resolution: "{package} est épinglé via `resolutions` : à retirer dès que la dépendance parente embarque le correctif."

verification:
  rescan_each: "Trivy a été relancé après chaque modification : les CVE des paquets ci-dessus ne sont plus signalées."
  rescan_final: "Trivy a été relancé une fois toutes les modifications appliquées : les CVE des paquets ci-dessus ne sont plus signalées."
  rescan_none: "Trivy n’a pas été relancé : le lockfile n’installe plus de version vulnérable des paquets ci-dessus."
  check_ok: "Le lockfile est cohérent avec le manifeste."
  check_existing: "Le contrôle de cohérence signalait déjà des points avant les correctifs et n’en signale aucun de nouveau :"
  check_failed: "Le contrôle de cohérence du lockfile a échoué :"

tooling:
  used: "Outils de l’environnement CI : {tools}."
  none: "Les outils de l’environnement CI sont utilisés, Rustine n’en installe aucun."

notify: "Pour information : {users}"

footer: "Généré par Rustine {version}. Ne modifiez pas la branche à la main : elle est reconstruite à chaque exécution."

commit:
  subject: "corriger les dépendances {ecosystem} vulnérables ({group})"
  subject_all: "corriger les dépendances {ecosystem} vulnérables"
  intro: "Montée vers la plus petite version qui corrige les CVE signalées :"

note:
  updated: "La branche a été reconstruite par une nouvelle exécution de Rustine (paquets corrigés : {packages}). La description a été mise à jour."
  closed: "Plus aucun paquet n’est corrigeable automatiquement (déjà corrigé, ou action manuelle requise) : fermeture de cette merge request. Rustine en ouvrira une nouvelle si une correction redevient possible."
  foreign: "La branche {branch} contient des commits que Rustine n’a pas créés : elle a été laissée telle quelle. Déplacez vos commits ailleurs ou supprimez la branche pour que Rustine puisse la mettre à jour de nouveau."
