title: "Security: fix {ecosystem} dependencies ({group})"

group:
  critical-high: "critical and high severity"
  others: "medium, low and unknown severity"

preview: "Preview of the plan: nothing has been executed yet, the fixes below are planned and not verified."

summary:
  fixed: "Packages fixed: {packages} · CVEs fixed: {cves}"
  planned: "Packages to fix: {packages} · CVEs to fix: {cves}"

section:
  fixed: "Fixes"
  attention: "Needs manual attention"
  debt: "Technical debt"
  verification: "Verification"
  tooling: "Tooling"

table:
  package: "Package"
  version: "Version"
  cves: "CVEs"
  severity: "Severity"
  dependency: "Dependency"
  strategy: "Strategy"

dependency:
  direct: "direct"
  transitive: "transitive, via {chain}"
  unknown: "unknown"

strategy:
  lockfile-refresh: "lockfile refresh"
  direct-bump: "range bump"
  resolution: "resolution"
  already: "fixed by another change of this MR"
  planned: "planned"

attention:
  major_bump: "{cves} only fixed in a new major version ({versions}): not applied automatically."
  no_fix: "{cves}: no fixed version has been published."
  unparsable: "the installed version {version} cannot be compared: check it by hand."
  unsupported_source: "declared with a source that Rustine does not change: update it by hand to a version that fixes {cves}."
  failed: "no automatic fix worked for {cves}."
  technical_details: "Technical details"

debt:
  resolution: "{package} is pinned through `resolutions`: remove the entry once the parent dependency ships the fix."

verification:
  rescan: "Trivy was run again after each change: the CVEs of the packages above are no longer reported."
  check_ok: "The lockfile is consistent with the manifest."
  check_failed: "The lockfile consistency check failed:"

tooling:
  pinned: "Tool versions used: {pinning}."
  none: "No tool pinning: the tools of the CI environment were used."

footer: "Generated by Rustine {version}. Do not edit the branch by hand: it is rebuilt on every run."

commit:
  subject: "fix vulnerable {ecosystem} dependencies ({group})"
  intro: "Bump to the smallest version that fixes the reported CVEs:"

note:
  updated: "The branch was rebuilt by a new Rustine run (packages fixed: {packages}). The description has been updated."
  closed: "No package of this group can be fixed automatically anymore (already fixed, or a manual action is needed): closing this merge request. Rustine opens a new one if a fix becomes possible again."
  foreign: "The branch {branch} contains commits that Rustine did not create, so it was left untouched. Move your commits elsewhere or delete the branch to let Rustine update it again."
