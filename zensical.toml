# Zensical configuration — English (root of the site).
# Generated pages live in docs/; `make docs` stages them with the shared assets in
# build/docs/en (Zensical copies everything it finds in docs_dir, see .claude/skills/build-docs/SKILL.md).

[project]
site_name = "Rustine"
site_description = "Opens GitLab merge requests that fix only the Composer and Yarn packages affected by a CVE reported by Trivy."
site_url = "https://umanit.github.io/rustine/"
repo_url = "https://github.com/umanit/rustine"
repo_name = "umanit/rustine"
copyright = "Rustine — MIT License"
docs_dir = "build/docs/en"
site_dir = "site"
use_directory_urls = true
favicon = "img/rustine-icon.svg"
extra_css = ["assets/extra.css"]
extra_javascript = ["assets/extra.js"]

# BEGIN NAV (generated by split_readme.py, do not edit by hand)
nav = [
  { "Home" = "index.md" },
  { "How it works" = "how-it-works.md" },
  { "Requirements" = "requirements.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Languages" = "languages.md" },
  { "Known limitations" = "known-limitations.md" },
  { "Development" = "development.md" },
  { "License" = "license.md" },
]
# END NAV

[project.theme]
language = "en"
logo = "img/rustine-icon.svg"
features = [
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Follows the system preference by default; the header button cycles auto → light → dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Language selector. The links are only a fallback: assets/extra.js points them at the same page in the other language.
[[project.extra.alternate]]
name = "English"
link = "./"
lang = "en"

[[project.extra.alternate]]
name = "Français"
link = "fr/"
lang = "fr"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
