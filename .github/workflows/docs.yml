name: Documentation

# Builds the English and French documentation (Zensical) and publishes it on GitHub Pages.
# Only a version tag (vX.Y.Z) publishes: the site always documents the latest release, not the moving main branch.
# Settings → Pages → Source must be set to "GitHub Actions", and the github-pages environment must accept `v*` tags.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Zensical
        run: pip install -r docs/requirements.txt

      # The pages are committed: they must be what README.md gives today.
      - name: Check the pages are up to date with the README
        run: |
          python3 tools/docs/split_readme.py
          git diff --exit-code -- docs zensical.toml zensical.fr.toml || {
            echo "::error::docs/ is out of date with README.md: run the build-docs skill and commit the result."
            exit 1
          }

      - name: Warn about outdated French pages
        run: |
          stale="$(python3 tools/docs/docs_tool.py stale | tr '\n' ' ')"
          if [ -n "$stale" ]; then echo "::warning::French pages to translate again: $stale"; fi

      - name: Build English (site/) then French (site/fr/)
        run: make docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
