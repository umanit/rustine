name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          tools: composer:v2
          coverage: none

      # The integration tests use a real Yarn (against a local registry); they are skipped without it.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.14.1 --activate
          yarn --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis and tests
        run: make full_static_analyze

      # Only one Yarn is active at a time: the Yarn Classic integration tests get their own pass.
      - name: Yarn Classic integration tests
        run: |
          corepack prepare yarn@1.22.22 --activate
          yarn --version
          vendor/bin/phpunit tests/Apply/YarnClassicIntegrationTest.php --fail-on-skipped

  phar:
    name: Build the PHAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, phar
          ini-values: phar.readonly=0
          tools: composer:v2
          coverage: none

      - name: Build and smoke-test the PHAR
        run: make phar
