# Zensical configuration — French (served under /fr/).
# Generated pages live in docs/fr/; `make docs` stages them with the shared assets in
# build/docs/fr (Zensical copies everything it finds in docs_dir, see .agents/skills/build-docs/SKILL.md).

[project]
site_name = "Rustine"
site_description = "Ouvre des merge requests GitLab qui corrigent uniquement les paquets Composer et Yarn touchés par une CVE remontée par Trivy."
site_url = "https://umanit.github.io/rustine/fr/"
repo_url = "https://github.com/umanit/rustine"
repo_name = "umanit/rustine"
copyright = "Rustine — MIT License"
docs_dir = "build/docs/fr"
site_dir = "site/fr"
use_directory_urls = true
favicon = "img/rustine-icon.svg"
extra_css = ["assets/extra.css"]
extra_javascript = ["assets/extra.js"]

# BEGIN NAV (generated by split_readme.py, do not edit by hand)
nav = [
  { "Accueil" = "index.md" },
  { "Fonctionnement" = "how-it-works.md" },
  { "Prérequis" = "requirements.md" },
  { "Installation" = "installation.md" },
  { "Utilisation" = "usage.md" },
  { "Langues" = "languages.md" },
  { "Limitations connues" = "known-limitations.md" },
  { "Développement" = "development.md" },
  { "Licence" = "license.md" },
]
# END NAV

[project.theme]
language = "fr"
logo = "img/rustine-icon.svg"
features = [
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Follows the system preference by default; the header button cycles auto → light → dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Passer en mode clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Suivre la préférence du système"

# Language selector. The links are only a fallback: assets/extra.js points them at the same page in the other language.
# BEGIN ALTERNATE (generated by split_readme.py, do not edit by hand)
[[project.extra.alternate]]
name = "English"
link = "../"
lang = "en"

[[project.extra.alternate]]
name = "Français"
link = "./"
lang = "fr"
# END ALTERNATE

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
